name: macOS bundled dependency audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Download verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40495376072 --repo "$GITHUB_REPOSITORY" --name macos-${{ matrix.arch }}-final --dir package
      - name: Check native loader dependencies
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir "$RUNNER_TEMP/audit-image"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/audit-image" package/*.dmg
          export APP="$RUNNER_TEMP/audit-image/SNI Tunnel.app"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          app=pathlib.Path(os.environ['APP'])
          result={}
          for name in ['Contents/MacOS/sni-tunnel','Contents/Helpers/xray']:
              output=subprocess.check_output(['otool','-L',str(app/name)],text=True)
              deps=[line.strip().split(' (',1)[0] for line in output.splitlines()[1:] if line.strip()]
              assert deps and all(dep.startswith(('/usr/lib/','/System/Library/')) for dep in deps), (name,deps)
              result[name]=deps
          pathlib.Path('dependency-audit-'+os.environ['ARCH']+'.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          hdiutil detach "$RUNNER_TEMP/audit-image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-dependencies-${{ matrix.arch }}
          path: dependency-audit-*.json
