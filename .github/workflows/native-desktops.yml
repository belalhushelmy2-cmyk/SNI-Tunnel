name: macOS native previews
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-desktops-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '3'
  RUST_MIN_STACK: '16777216'
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Native build and unit tests
        run: |
          cargo build --release --locked
          SNI_TUNNEL_DATA_DIR="$RUNNER_TEMP/sni-tests" cargo test --release --locked --lib
      - name: Build application bundle and disk image
        run: python3 packaging/native/package.py --output releases/v2/macos
      - name: Smoke test native application
        run: python3 packaging/native/smoke.py --dmg releases/v2/macos/SNI-Tunnel-V2-2.1.5-macos-${{ matrix.arch }}.dmg --output releases/v2/macos/validation-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}
          path: releases/v2/macos/*
