name: FreeBSD native proxy preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freebsd-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and verify on FreeBSD 14.3
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: '14.3'
          usesh: true
          mem: 6144
          cpu: 4
          prepare: |
            pkg install -y curl python3 pkgconf bzip2 fontconfig libxkbcommon libX11 libXcursor libXrandr libXi libxcb mesa-libs wayland glib dbus xclip ca_root_nss xorg-vfbserver dejavu xwininfo
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.1
          run: |
            set -eu
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            export CARGO_BUILD_JOBS=3 RUST_MIN_STACK=16777216 CARGO_PROFILE_RELEASE_LTO=false
            cargo build --release --locked
            SNI_TUNNEL_DATA_DIR=/tmp/sni-tests cargo test --release --locked --lib
            python3 packaging/native/package.py --output releases/v2/freebsd
            pkg install -y ./releases/v2/freebsd/sni-tunnel-v2-2.1.5.pkg
            pkg check -s sni-tunnel-v2
            pkg check -d sni-tunnel-v2
            ldd /usr/local/lib/sni-tunnel-v2/sni-tunnel
            Xvfb :98 -screen 0 1366x768x24 > /tmp/sni-xvfb.log 2>&1 < /dev/null &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            export DISPLAY=:98 SLINT_BACKEND=winit-software
            python3 packaging/native/smoke.py --binary /usr/local/lib/sni-tunnel-v2/sni-tunnel --tls-fixture --output releases/v2/freebsd/validation-freebsd.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freebsd-amd64
          path: releases/v2/freebsd/*
