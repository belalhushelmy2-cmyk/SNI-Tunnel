name: Verify final native desktop packages and TLS pins
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-repack.yml'
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, macos, freebsd]
        default: all
      freebsd_run:
        type: string
        default: '40493289905'
permissions:
  contents: read
  actions: read
concurrency:
  group: native-package-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform != 'freebsd'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            previous_sha: 57b8f13afa86d7c3051f1432498840788bd1177e9c2d590d2ccd76952583e347
          - runner: macos-15-intel
            arch: x86_64
            previous_sha: 56d2263544d74cf590b3ceacfe2d51df5ca59974b5afb02c766386ab6d101f6a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reuse tested native executable
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ matrix.previous_sha }}
        run: |
          gh run download 40490747785 --repo "$GITHUB_REPOSITORY" --name macos-${{ matrix.arch }} --dir target/previous
          image="target/previous/SNI-Tunnel-V2-2.1.5-macos-${{ matrix.arch }}.dmg"
          echo "$PREVIOUS_SHA  $image" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/source-image" target/native-binary
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/source-image" "$image"
          cp "$RUNNER_TEMP/source-image/SNI Tunnel.app/Contents/MacOS/sni-tunnel" target/native-binary/sni-tunnel
          hdiutil detach "$RUNNER_TEMP/source-image"
      - name: Package matching core and verify custom SNI
        run: |
          python3 packaging/native/package.py --binary target/native-binary/sni-tunnel --output releases/v2/macos
          python3 packaging/native/smoke.py --dmg releases/v2/macos/SNI-Tunnel-V2-2.1.5-macos-${{ matrix.arch }}.dmg --tls-fixture --output releases/v2/macos/validation-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}-final
          path: releases/v2/macos/*
  freebsd:
    if: github.event_name == 'push' || inputs.platform != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Obtain successfully tested FreeBSD binary
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.freebsd_run || '40493289905' }}
        run: |
          gh run watch "$BASE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run download "$BASE_RUN" --repo "$GITHUB_REPOSITORY" --name freebsd-amd64 --dir target/previous
      - name: Package matching core and verify on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: '14.3'
          usesh: true
          mem: 4096
          cpu: 2
          prepare: |
            pkg install -y python3 xorg-vfbserver dejavu
          run: |
            set -eu
            pkg install -y ./target/previous/sni-tunnel-v2-2.1.5.pkg
            python3 packaging/native/package.py --binary /usr/local/lib/sni-tunnel-v2/sni-tunnel --output releases/v2/freebsd
            pkg install -y -f ./releases/v2/freebsd/sni-tunnel-v2-2.1.5.pkg
            pkg check -s sni-tunnel-v2
            Xvfb :98 -screen 0 1366x768x24 &
            export DISPLAY=:98 SLINT_BACKEND=winit-software
            python3 packaging/native/smoke.py --binary /usr/local/lib/sni-tunnel-v2/sni-tunnel --tls-fixture --output releases/v2/freebsd/validation-freebsd.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freebsd-amd64-final
          path: releases/v2/freebsd/*
