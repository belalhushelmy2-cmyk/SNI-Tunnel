plugins { id 'com.android.application' }
android {
    namespace 'com.snitunnel.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.snitunnel.android'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.0.5'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    flavorDimensions 'device'
    productFlavors {
        phone { dimension 'device'; resValue 'string', 'app_name', 'SNI Tunnel' }
        tv { dimension 'device'; applicationIdSuffix '.tv'; resValue 'string', 'app_name', 'SNI Tunnel TV' }
    }
    signingConfigs {
        release {
            if (System.getenv('SNI_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('SNI_ANDROID_KEYSTORE'))
                storePassword System.getenv('SNI_ANDROID_STORE_PASSWORD')
                keyAlias 'sni-tunnel'
                keyPassword System.getenv('SNI_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libxray.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation files('libs/hev-socks5-tunnel.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
