name       : sni-tunnel-v2
version    : '2.1.6'
release    : 2
source     :
    - https://github.com/belalhushelmy2-cmyk/SNI-Tunnel/releases/download/v2.1.6/sni-tunnel-v2_2.1.6_amd64.tar.gz : 7a3fe4bcd6c72ec77930bec5e6121b65a2c4fda0380e24e5eeaf394b6ec0f567
homepage   : https://github.com/belalhushelmy2-cmyk/SNI-Tunnel
license    : LicenseRef-SNI-Tunnel
component  : network.clients
summary    : Native VMess desktop with independent TLS SNI
strip      : false
debug      : false
autodep    : true
rundeps    :
    - glibc
    - libgcc
    - fontconfig
    - liberation-fonts-ttf
    - glib2
    - libxkbcommon
    - libx11
    - libxcb
    - libxcursor
    - libxrandr
    - libxi
    - wayland
    - mesalib
    - python3
    - iproute2
    - nftables
    - libnotify
    - polkit
    - ca-certs
    - kmod
    - dbus
    - wl-clipboard
    - xclip
description: |
    Slint desktop with bundled Xray and BadVPN, independent SNI, Linux TUN,
    real traffic statistics and DNS recovery. Updates preserve user profiles.
install    : |
    install -d "$installdir/usr/lib/sni-tunnel-v2"
    cp -a . "$installdir/usr/lib/sni-tunnel-v2/"
    install -Dm00755 "$pkgfiles/sni-tunnel-v2" "$installdir/usr/bin/sni-tunnel-v2"
    install -Dm00644 "$pkgfiles/sni-tunnel-v2.desktop" "$installdir/usr/share/applications/sni-tunnel-v2.desktop"
    install -Dm00644 icon.png "$installdir/usr/share/icons/hicolor/256x256/apps/sni-tunnel-v2.png"
